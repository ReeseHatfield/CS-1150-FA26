<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
	<script>
        // read in data
        // how much data?
        var totalItems = prompt("How many items?");
        totalItems = parseInt(totalItems);

        //  1 < 3 -> OK
        // 2 < 3 -> OK
        // 3 < 3 -> NOT
        document.write("<h1> My Grocery List: </h1>")
        document.write("<ul>")
        for(var i = 1; i <= totalItems; i = i + 1){
            
            var curItem = prompt("Enter Item " + i);
            document.write("<li>" + curItem + "</li>");
        }

        document.write("</ul>")

    </script>

</body>
</html>
